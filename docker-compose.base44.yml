name: stream-command

services:
  db:
    image: postgres:16
    restart: on-failure
    environment:
      POSTGRES_DB: stream_command
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sc_dev_postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d stream_command']
      interval: 5s
      timeout: 5s
      retries: 20

  install:
    image: node:22
    working_dir: /app
    restart: 'no'
    volumes:
      - ${BASE44_PROJECT_ROOT}:/app
      - node_modules:/app/node_modules
    command: ['sh', '-ec', 'npm ci --no-audit --no-fund || npm install --no-audit --no-fund']

  migrate:
    image: node:22
    working_dir: /app
    restart: 'no'
    volumes:
      - ${BASE44_PROJECT_ROOT}:/app
      - node_modules:/app/node_modules
    environment:
      MIGRATION_DATABASE_URL: postgres://postgres:sc_dev_postgres@db:5432/stream_command
      APP_DB_PASSWORD: sc_dev_password
    depends_on:
      db:
        condition: service_healthy
      install:
        condition: service_completed_successfully
    command: ['sh', '-ec', 'npx tsx server/migrate.ts']

  api:
    image: node:22
    working_dir: /app
    restart: on-failure
    env_file:
      - ${BASE44_PROJECT_ROOT}/.env.base44-defaults
      - /run/base44/app.env
    environment:
      PORT: '4000'
      DATABASE_URL: postgres://sc_app:sc_dev_password@db:5432/stream_command
      MIGRATION_DATABASE_URL: postgres://postgres:sc_dev_postgres@db:5432/stream_command
      UPLOAD_DIR: /app/uploads
      BASE44_PUBLIC_HOST_SUFFIX:
    volumes:
      - ${BASE44_PROJECT_ROOT}:/app
      - node_modules:/app/node_modules
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ['sh', '-ec', 'exec npx tsx watch --clear-screen=false server/index.ts']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    environment:
      API_PROXY_TARGET: http://api:4000
      BASE44_PREVIEW_MODE:
      BASE44_SANDBOX_HOST_DOMAIN:
      BASE44_PUBLIC_HOST_SUFFIX:
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: .${BASE44_SANDBOX_HOST_DOMAIN}
    volumes:
      - ${BASE44_PROJECT_ROOT}:/app
      - node_modules:/app/node_modules
    ports:
      - '3000:3000'
    depends_on:
      install:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    command: ['sh', '-ec', 'exec npx vite --host 0.0.0.0 --port 3000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

volumes:
  db_data:
  node_modules:
  uploads:
