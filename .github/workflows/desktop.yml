name: desktop

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: URL pública do STREAM COMMAND carregada pelo aplicativo
        required: true
        default: https://stream-command.onrender.com

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - name: Dependências do Linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STREAM_COMMAND_APP_URL: ${{ inputs.app_url }}
        with:
          projectPath: src-tauri
          tagName: desktop-v__VERSION__
          releaseName: 'STREAM COMMAND Desktop v__VERSION__'
          releaseBody: Instaladores do aplicativo desktop (Windows, macOS e Linux).
          releaseDraft: true
          prerelease: false
